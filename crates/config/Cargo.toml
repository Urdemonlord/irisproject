[package]
name = "iris-config"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
dotenvy = "0.15"
anyhow = "1.0"
# The same URL parser reqwest (the Stalwart admin HTTP client) uses:
# `validate_stalwart_management_url` gates on it so a URL the client
# cannot parse is rejected at startup instead of failing every request.
url = "2.5"
