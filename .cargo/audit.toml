# cargo-audit ignores, documented per finding (see `cargo audit`).
[advisories]
ignore = [
    # RUSTSEC-2023-0071 (rsa 0.9.10, Marvin Attack — timing side-channel
    # key recovery on RSA decryption, no fixed upgrade available):
    # rsa is NOT in IRIS's build graph — `cargo tree -i rsa` (incl.
    # `--target all`) prints nothing. It only enters Cargo.lock as an
    # optional dependency of sqlx-mysql 0.8.6, and the workspace enables
    # only sqlx features runtime-tokio-rustls + sqlite + migrate
    # (root Cargo.toml), so no MySQL code — and no RSA decryption — is
    # ever compiled or executed. IRIS talks to SQLite only. Revisit if
    # a mysql feature is ever enabled or a fixed rsa release appears.
    "RUSTSEC-2023-0071",
]
