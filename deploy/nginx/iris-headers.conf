# /etc/nginx/snippets/iris-headers.conf
# Include at server level AND in every location that has its own add_header
# (nginx does not inherit add_header into such locations).
# No CSP here: IRIS loads Google Fonts, and HTML mail is rendered in a srcdoc
# iframe that inherits the page CSP (a strict style-src would break mail).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
