# IRIS all-in-one stack: API + web + Stalwart mail server.
#
#   SESSION_SECRET=$(openssl rand -hex 32) docker compose -f deploy/compose/docker-compose.yaml up -d --build
#
# Then open http://127.0.0.1:8080. Before real use you must still:
#   - create Stalwart accounts (one permanent user per mailbox + the
#     catch-all TEMP_INBOX_MAIL_USER) — see README Deployment §1;
#   - set a real TEMP_INBOX_DOMAIN (the default is the example value);
#   - put TLS + a public domain in front for anything beyond localhost.
#
# Turnstile (optional login CAPTCHA): set TURNSTILE_SECRET_KEY and
# TURNSTILE_HOSTNAMES for the API, and TURNSTILE_SITE_KEY for the web
# build — both keys together or neither. A secret without a site key
# locks every login out (the form renders no widget), so the web
# build arg below is wired the same way as the API variables.
#
# Known limitation: the API trusts X-Real-IP only from a loopback proxy
# (see apps/api/src/main.rs: client_ip). In this stack nginx runs in its
# own container, so per-IP rate limits see the proxy's IP, not the real
# client IP. The systemd + nginx deployment does not have this problem.

services:
  api:
    build:
      context: ../../
      dockerfile: ./deploy/api.Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      IRIS_ENV: ${IRIS_ENV:-production}
      IRIS_HOST: 0.0.0.0
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET first, e.g. SESSION_SECRET=$(openssl rand -hex 32)}
      DATABASE_URL: sqlite:///data/iris.db
      STALWART_API_URL: http://stalwart:8080
      TEMP_INBOX_DOMAIN: ${TEMP_INBOX_DOMAIN:-inbox.example.com}
      TEMP_INBOX_MAIL_USER: ${TEMP_INBOX_MAIL_USER:-}
      TEMP_INBOX_MAIL_PASSWORD: ${TEMP_INBOX_MAIL_PASSWORD:-}
      SEND_LOCAL_DOMAINS: ${SEND_LOCAL_DOMAINS:-example.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      IRIS_PASSWORD_RESET_SERVICE_TOKEN: ${IRIS_PASSWORD_RESET_SERVICE_TOKEN:-}
      IRIS_PASSWORD_RESET_EMAIL_FROM: ${IRIS_PASSWORD_RESET_EMAIL_FROM:-}
      IRIS_PASSWORD_RESET_EMAIL_TO: ${IRIS_PASSWORD_RESET_EMAIL_TO:-}
      IRIS_PASSWORD_RESET_PUBLIC_ORIGIN: ${IRIS_PASSWORD_RESET_PUBLIC_ORIGIN:-}
      IRIS_RESEND_API_URL: ${IRIS_RESEND_API_URL:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-}
    volumes:
      - api-data:/data
    depends_on:
      - stalwart

  web:
    build:
      context: ../../
      dockerfile: ./apps/web/Dockerfile
      args:
        VITE_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

  stalwart:
    image: stalwartlabs/stalwart:latest
    ports:
      - "25:25"
      - "587:587"
      - "465:465"
      - "143:143"
      - "993:993"
      - "110:110"
      - "995:995"
      - "127.0.0.1:8091:8080"
    volumes:
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart

volumes:
  api-data:
  stalwart-etc:
  stalwart-data:
