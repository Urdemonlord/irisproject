# IRIS web inside Docker Compose: static bundle + proxy to the API service.
# Plain HTTP on localhost only — put TLS in front for any public deployment.
# Adapted from deploy/nginx/mail.example.com (same locations, no TLS/Cloudflare).
server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/iris-headers.conf;

    # API + auth (same origin for CSRF cookie).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health { proxy_pass http://api:8000/health; }
    location = /ready  { proxy_pass http://api:8000/ready; }

    # Static frontend. The app uses hash routes (#/temp), so no SPA fallback is
    # needed: unknown paths get the real 404 page.
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    # Hashed build files never change.
    location /assets/ {
        include /etc/nginx/snippets/iris-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML and root files (favicon, og-image, robots, sitemap): always revalidate.
    location / {
        include /etc/nginx/snippets/iris-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
