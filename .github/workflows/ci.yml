# IRIS CI — quality gates from docs/06-IPD.md §9.
# Runs on every push and pull request. No deploy, no secrets needed:
# the Rust tests use in-memory SQLite and the web build is static.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain with rustfmt + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy (-D warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --all-targets

  web:
    name: Web (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
      - name: Production build (vite build)
        run: npm run build

  audit:
    # Dependency vulnerability review (docs/07-PRODUCTION-READINESS.md §3).
    # Advisory for now: reports findings without blocking the pipeline.
    name: Audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # NOTE (2026-11-05): rustsec/audit-check@v2 was removed. It runs
      # `cargo audit --json` and does an unguarded JSON.parse(stdout), so
      # any early cargo-audit failure surfaces only as the misleading
      # "Unexpected end of JSON input" and hides the real error. Reproduced
      # locally: cargo-audit <= 0.21.x cannot load the current RustSec DB
      # (advisory RUSTSEC-2026-0331 carries a CVSS:4.0 vector, which those
      # versions reject with "unsupported CVSS version: 4.0"), exits
      # non-zero with EMPTY stdout -> JSON.parse('') throws. cargo-audit
      # 0.22.2 parses the same DB fine. Audit is NOT disabled: it now runs
      # directly with a pinned prebuilt 0.22.2, so real failures surface
      # with their real error message.
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit 0.22.2 (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - name: cargo audit
        # Advisory: a finding exits 1 but must not skip the npm audit step.
        continue-on-error: true
        run: cargo audit
      - name: npm audit
        working-directory: apps/web
        run: npm audit --audit-level=high
