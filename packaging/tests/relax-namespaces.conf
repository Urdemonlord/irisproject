# Test-only drop-in (NEVER shipped in the .deb). The sandbox cannot
# create a mount namespace at all: even a plain `unshare --mount`
# fails with EINVAL on the container's locked mounts (the /sys bind and
# the tmpfs root), so any service with PrivateTmp, ProtectSystem,
# ProtectHome or ReadWritePaths exits 226/NAMESPACE here. Bisected
# 2026-11-08: each of the four directives alone breaks iris-api, and
# all four together work on a real system (the same hardening is in
# the reference package and in production IRIS). This clears exactly
# those four directives so the install test can prove the rest of the
# stack; NoNewPrivileges, MemoryMax, User/Group and the rest stay in
# effect. The shipped units keep the hardening.
[Service]
# NB: empty assignments reset list settings (ReadWritePaths) but NOT
# booleans or enums (PrivateTmp, ProtectHome, ProtectSystem keep their
# values when assigned empty), so set the defaults explicitly.
PrivateTmp=false
ProtectSystem=false
ProtectHome=false
ReadWritePaths=
